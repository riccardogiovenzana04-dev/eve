; eve firmware for the Seeed Studio XIAO ESP32S3 Sense
;
;   Mic     built-in PDM microphone on the Sense board (CLK GPIO42, DATA GPIO41)
;   Button  12 mm tactile switch between D1 (GPIO2) and GND
;   Light   onboard orange user LED (GPIO21)
;   USB-C   native USB (the board's only port)
;
; No Atech library needed. Same USB protocol as ../firmware, so host/voicetype.py
; works with either stick.
;
; Build:  pio run
; Flash:  pio run -t upload    (if it times out: hold BOOT, tap RESET, release BOOT)

[env:xiao]
platform = espressif32@~6.4.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; ARDUINO_USB_* are required on the ESP32-S3 or USB serial never appears.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; Before wiring the big button, test with the board's own BOOT button:
;   pio run -e xiao-boot -t upload
[env:xiao-boot]
extends = env:xiao
build_flags =
    ${env:xiao.build_flags}
    -DBTN_PIN=0
